<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
</head>

<body>
    <div class="covid-background">
        <div class="card-one d-flex flex-row">
            <div>
                <h1 class="card-one-heading">All You Need To Know About Covid-19</h1>
                <button class="btn btn-properties btn-primary">Know more </button>
            </div>
            <div>
                <img src="https://d2clawv67efefq.cloudfront.net/ccbp-static-website/medicalcare-img.png" />
            </div>
        </div>
        <div class="card-two d-flex flex-row ">
            <div class=" card-two-image d-flex flex-column justify-content-center">
                <img src="https://d2clawv67efefq.cloudfront.net/ccbp-static-website/coronavirus-img.png" />
            </div>
            <div class="card-two-text">
                <h1 class="card-two-heading"> COVID-19 Test </h1>
                <p class="card-two-paragraph">If you think you have been exposed to novel coronavirus (COVID-19)...more</p>

            </div>
        </div>
        <h1 class="symptoms-heading">Symptoms </h1>
        <div class=" symptoms  symptoms-paragraph d-flex flex-row ">
            <div class="dry-cough ">
                <img src="https://d2clawv67efefq.cloudfront.net/ccbp-static-website/cough-img.png" />
                <p>Dry cough </p>
            </div>
            <div class="high-fever ">
                <img src="https://d2clawv67efefq.cloudfront.net/ccbp-static-website/fever-img.png" />
                <p>High fever</p>
            </div>
            <div class="headache  ">
                <img src="https://d2clawv67efefq.cloudfront.net/ccbp-static-website/headache-img.png" />
                <p>Headache</p>
            </div>
        </div>
        <h1 class="video">Videos </h1>
        <div class=" video-card d-flex flex-row">
            <div class="video-image">
                <img src="https://d2clawv67efefq.cloudfront.net/ccbp-static-website/doctor-img.png" />
            </div>
            <div class="video-image">
                <h1 class="video-heading"> To prevent the spread of... </h1>
                <p class="video-paragraph">If you think you have been exposed to novel coronavirus (COVID-19)</p>
                <button class="btn btn-properties btn-primary"> watch video </button>
            </div>
        </div>
    </div>
</body>

</html>
